[package]
name = "coconut-calendar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
ramp = {package = "ramp2", version = "1.0.2"}
chk = {version = "1.1.0", git = "https://github.com/ramp-stack/chk", rev = "e2a15c6"}
chrono = {version = "0.4.44", features = ["serde"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"

[lib]
name="main"
crate-type=["staticlib", "cdylib", "rlib"]

[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3

# Workaround: maverick_os 3.0.2 iOS LibraryPickerDelegate trips objc2 debug-only
# protocol check (picker:didFinishPicking: not in the protocol impl). Remove once fixed.
[profile.dev.package.maverick_os]
debug-assertions = false
[profile.dev.package.objc2]
debug-assertions = false
