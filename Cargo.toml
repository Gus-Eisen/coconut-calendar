[package]
name = "coconut-calendar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
ramp = {package = "ramp2", version = "3.0.4"}
chk = {version = "2.0.0", git = "https://github.com/ramp-stack/chk", rev = "2da2ba12e6973c17ffa7d8e70dc218d342552fdf"}
chrono = {version = "0.4.44", features = ["serde"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"

[package.metadata.piston.ios]
team = "6DW6N89944"
bundle_id = "com.guseisen.coconut.dev"
minimum_os = "17.0"
info_plist = "ios/Info.plist"

[package.metadata.piston.developer]
team = "6DW6N89944"
identity = "028c91abcaf5f189cade6c92e0a81baba29caa05c88ed7aa5ce85b0cf353ede056"

[package.metadata.piston.notifications]
enabled = false

[lib]
name="main"
crate-type=["staticlib", "cdylib", "rlib"]

[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
